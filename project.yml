name: FacturXCheck
options:
  bundleIdPrefix: com.blancconseil
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FacturXKit:
    path: .

targets:
  FacturXCheck:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: App/Assets.xcassets
    dependencies:
      - package: FacturXKit
        product: FacturXKit
    settings:
      base:
        PRODUCT_NAME: Factur-X Check
        PRODUCT_BUNDLE_IDENTIFIER: com.blancconseil.facturx-check
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/FacturXCheck.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Factur-X Check
        CFBundleDisplayName: Factur-X Check
        CFBundleDevelopmentRegion: fr
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: "© 2026 Daniel-Romain Blanc — Blanc-Conseil. Distribué sous licence MIT."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        # Permet « Ouvrir avec » depuis le Finder sur un PDF, en lecture seule.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
